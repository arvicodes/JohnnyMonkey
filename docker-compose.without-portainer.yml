version: '3.8'

services:
  johnnymonkey:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: johnnymonkey-app
    ports:
      - "3001:3001"  # Server API (serves both API and frontend)
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      # Verwende die DB direkt aus dem Git-Checkout (immer aktueller Stand nach Pull)
      - ./server/prisma/dev.db:/app/server/prisma/dev.db
      # Material-Dateien
      - ./material:/app/material:ro
      # Verwende J-M-Reihen direkt aus dem Git-Checkout
      - ./J-M-Reihen:/app/J-M-Reihen
      # Optional: Logs für einfacheren Zugriff
      - johnnymonkey_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Portainer Labels für bessere Organisation
      - "com.portainer.io.name=JohnnyMonkey"
      - "com.portainer.io.description=Educational Learning Platform"
      - "com.portainer.io.category=Application"
      - "com.portainer.io.managed=true"
    networks:
      - johnnymonkey-network

networks:
  johnnymonkey-network:
    driver: bridge
    name: johnnymonkey-network

volumes:
  postgres_data:
    name: johnnymonkey_postgres_data
  johnnymonkey_logs:
    name: johnnymonkey_logs
    driver: local

