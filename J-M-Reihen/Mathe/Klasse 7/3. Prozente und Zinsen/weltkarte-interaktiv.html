<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Weltkarte - Google Earth Style</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            text-align: center;
        }

        .controls {
            position: absolute;
            top: 50px;
            left: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            backdrop-filter: blur(10px);
            min-width: 170px;
            max-width: 185px;
            font-size: 12px;
        }

        .control-group {
            margin-bottom: 6px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-group label {
            display: block;
            margin-bottom: 2px;
            font-weight: bold;
            color: #333;
            font-size: 11px;
        }

        .control-group select,
        .control-group input {
            width: 100%;
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 11px;
            box-sizing: border-box;
        }

        .control-group button {
            width: 100%;
            padding: 5px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .control-group button:hover {
            transform: translateY(-1px);
        }

        /* Info-Panel ist jetzt im Menü integriert */

        .coordinates {
            font-family: monospace;
            background: #f0f0f0;
            border-radius: 4px;
        }

        #map {
            height: 100vh;
            width: 100vw;
        }

        .custom-popup {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .popup-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .popup-content {
            color: #666;
            line-height: 1.5;
        }

        .layers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }

        .layer-toggle {
            display: flex;
            align-items: center;
            font-size: 9px;
            padding: 2px 3px;
            border-radius: 3px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .layer-toggle:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .layer-toggle input[type="checkbox"] {
            margin-right: 3px;
            transform: scale(0.85);
            cursor: pointer;
        }

        .layer-toggle label {
            margin: 0;
            font-weight: normal;
            font-size: 9px;
            cursor: pointer;
            user-select: none;
        }

        /* Kompakte Hinweistexte */
        .control-group > div[style*="font-size: 12px"] {
            font-size: 10px !important;
            margin-top: 3px !important;
            line-height: 1.3;
        }

        /* Kompaktere Suchbox-Tipps */
        .control-group > div {
            font-size: 10px;
            margin-top: 3px;
            line-height: 1.3;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        /* Laufmodus Styles */
        .walk-mode-active {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4) !important;
            color: white !important;
        }

        .player-character {
            position: absolute;
            width: 30px;
            height: 30px;
            background: transparent;
            border: none;
            z-index: 1000 !important;
            pointer-events: none;
            display: flex !important;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            visibility: visible !important;
            opacity: 1 !important;
        }

        .player-character .walking-emoji {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
            transition: opacity 0.15s ease-in-out, transform 0.15s ease-in-out;
        }

        /* Lauf-Animation für die Figur - Beinbewegung durch Rotation */
        .player-character.walking .walking-emoji,
        .walking-emoji[style*="animation"] {
            animation: walkLegs 0.6s ease-in-out infinite !important;
            transform-origin: center bottom;
            will-change: transform;
        }

        @keyframes walkLegs {
            0%, 100% {
                transform: translateY(0px) rotate(0deg) scaleY(1);
            }
            25% {
                transform: translateY(-1px) rotate(-2deg) scaleY(0.98);
            }
            50% {
                transform: translateY(0px) rotate(0deg) scaleY(1);
            }
            75% {
                transform: translateY(-1px) rotate(2deg) scaleY(0.98);
            }
        }

        /* Walk-Controls sind jetzt im Hauptmenü */
        .walk-mode-section {
            display: none;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #ddd;
        }

        .walk-mode-section.active {
            display: block;
        }

        .walk-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            margin-top: 4px;
            font-size: 12px;
            color: #666;
        }

        .walk-stats > div {
            background: #f8f9fa;
            padding: 3px;
            border-radius: 3px;
            text-align: center;
        }

        .walk-speed-control {
            margin-top: 4px;
        }

        .walk-speed-control label {
            display: block;
            margin-bottom: 2px;
            font-size: 10px;
            color: #333;
        }

        .walk-speed-control input {
            width: 100%;
            height: 18px;
        }

        /* Info-Panel ist jetzt auch im Menü */
        .info-section {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #ddd;
        }

        .info-section label {
            font-size: 10px;
        }

        /* Loading-Indikator */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: #333;
            text-align: center;
        }

        .loading-subtext {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        /* Leaflet "Map data not yet available" Text verstecken */
        .leaflet-container .leaflet-control-attribution {
            font-size: 11px;
        }

        /* Verstecke Leaflet Loading-Meldung */
        .leaflet-container .leaflet-top,
        .leaflet-container .leaflet-bottom {
            z-index: 1000;
        }

        /* Überschreibe Leaflet's "Map data not yet available" */
        .leaflet-container {
            background: #ddd !important;
        }

        /* Verstecke Leaflet Fehlermeldung */
        .leaflet-zoom-box,
        .leaflet-control-zoom,
        .leaflet-control-container {
            pointer-events: auto;
        }

        /* Verstecke Leaflet Standard-Loading-Text */
        body:after {
            content: '';
        }

        /* Verstecke spezifisch Leaflet "Map data not yet available" Meldungen */
        .leaflet-container:before,
        .leaflet-container:after {
            display: none !important;
            content: '' !important;
        }

        /* Verstecke Leaflet Fehler- und Loading-Texte */
        .leaflet-container .leaflet-tile-container {
            opacity: 1;
        }

        /* Verstecke Leaflet Fehlermeldungen vollständig */
        .leaflet-container .leaflet-error-tile,
        .leaflet-container .leaflet-error-tile-pane {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌍 Interaktive Weltkarte - Google Earth Style</h1>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="mapStyle">Kartenstil:</label>
            <select id="mapStyle">
                <option value="street">Straßenkarte</option>
                <option value="satellite" selected>Satellitenbild</option>
                <option value="terrain">Gelände</option>
                <option value="hybrid">Hybrid</option>
            </select>
        </div>

        <div class="control-group">
            <label>Ebenen:</label>
            <div class="layers-grid">
                <div class="layer-toggle">
                    <input type="checkbox" id="countries" checked>
                    <label for="countries">Länder</label>
                </div>
                <div class="layer-toggle">
                    <input type="checkbox" id="cities" checked>
                    <label for="cities">Städte</label>
                </div>
                <div class="layer-toggle">
                    <input type="checkbox" id="rivers">
                    <label for="rivers">Flüsse</label>
                </div>
                <div class="layer-toggle">
                    <input type="checkbox" id="mountains">
                    <label for="mountains">Berge</label>
                </div>
            </div>
        </div>

        <div class="control-group">
            <label for="searchLocation">Ort suchen:</label>
            <div style="display: flex; gap: 3px; align-items: center;">
                <input type="text" id="searchLocation" placeholder="z.B. München, Hamburg" style="flex: 1;">
                <button onclick="searchLocation()" style="width: auto; padding: 4px 8px; white-space: nowrap;">Suchen</button>
            </div>
        </div>

        <div class="control-group">
            <button onclick="flyToRandomLocation()">🎲 Zufälliger Ort + Laufen</button>
        </div>

        <div class="control-group">
            <label for="characterSelect">Charakter:</label>
            <select id="characterSelect" onchange="changeCharacter()" style="width: 100%; padding: 4px; border: 1px solid #ddd; border-radius: 4px; font-size: 11px;">
                <option value="🚶">🚶 Standard</option>
                <option value="🚶‍♂️">🚶‍♂️ Männlich</option>
                <option value="🚶‍♀️">🚶‍♀️ Weiblich</option>
                <option value="🏃">🏃 Läufer</option>
                <option value="🏃‍♂️">🏃‍♂️ Männlich Läufer</option>
                <option value="🏃‍♀️">🏃‍♀️ Weiblich Läufer</option>
                <option value="🧑‍🦯">🧑‍🦯 Mit Stock</option>
                <option value="🚴">🚴 Fahrradfahrer</option>
            </select>
        </div>

        <div class="control-group">
            <button onclick="toggleWalkMode()" id="walkModeBtn">🚶 Laufmodus</button>
            <div style="font-size: 9px; color: #666; margin-top: 2px; line-height: 1.2;">
                💡 Auto: Stadt + Street-View
            </div>
        </div>

        <!-- Info-Panel integriert -->
        <div class="info-section">
            <label>📍 Position:</label>
            <div class="coordinates" id="coordinates" style="font-size: 11px; padding: 3px; margin: 2px 0;">
                Breitengrad: 0°<br>
                Längengrad: 0°
            </div>
            <div id="locationInfo" style="font-size: 11px; padding: 3px; margin: 3px 0; background: #f0f4f8; border-radius: 3px; display: none;">
                <div style="font-weight: bold; color: #667eea; margin-bottom: 2px; font-size: 12px;" id="locationName">Lade...</div>
                <div style="font-size: 10px; color: #666; line-height: 1.3;" id="locationFacts"></div>
            </div>
            <div class="stats" id="stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 3px;">
                <div class="stat-item" style="background: #f8f9fa; padding: 3px; border-radius: 3px; text-align: center;">
                    <div class="stat-value" id="zoomLevel" style="font-size: 14px; font-weight: bold; color: #667eea;">1</div>
                    <div class="stat-label" style="font-size: 11px; color: #666;">Zoom</div>
                </div>
                <div class="stat-item" style="background: #f8f9fa; padding: 3px; border-radius: 3px; text-align: center;">
                    <div class="stat-value" id="distance" style="font-size: 14px; font-weight: bold; color: #667eea;">0 km</div>
                    <div class="stat-label" style="font-size: 11px; color: #666;">Entfernung</div>
                </div>
            </div>
        </div>

        <!-- Walk-Controls integriert -->
        <div class="walk-mode-section" id="walkModeSection">
            <div class="walk-stats">
                <div>Schritte: <span id="stepCount">0</span></div>
                <div>Entfernung: <span id="walkDistance">0 m</span></div>
            </div>
            <div class="walk-speed-control">
                <label for="walkSpeed">Geschwindigkeit:</label>
                <input type="range" id="walkSpeed" min="1" max="5" value="2" onchange="updateWalkSpeed()">
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Loading-Indikator -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">🗺️ Karte wird geladen...</div>
        <div class="loading-subtext">Bitte warten Sie, während die Kartendaten heruntergeladen werden</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Globale Variablen
        let map;
        let currentLayers = {};
        let lastClickPosition = null;
        let worldData = {
            countries: [],
            cities: [],
            rivers: [],
            mountains: []
        };

        // Laufmodus Variablen
        let walkMode = false;
        let playerPosition = null;
        let playerMarker = null;
        let stepCount = 0;
        let totalDistance = 0;
        let walkSpeed = 2;
        let lastStepTime = 0;
        let pressedKeys = {}; // Für kontinuierliches Laufen bei gedrückt gehaltener Taste
        let movementAnimationFrame = null; // Animation Frame für flüssige Bewegung
        let lastLocationUpdate = 0; // Throttling für Ortsinformationen
        let selectedCharacter = '🚶'; // Ausgewählter Charakter

        // Karte initialisieren
        function initMap() {
            // Loading-Indikator anzeigen
            showLoadingIndicator();

            // Karte erstellen - OpenStreetMap als zuverlässiger Standard
            map = L.map('map', {
                center: [20, 0],
                zoom: 2,
                zoomControl: true,
                attributionControl: true,
                fadeAnimation: false, // Keine Fade-Animation für schnelleres Laden
                zoomAnimation: true,
                markerZoomAnimation: true
            });

            // Entferne "Map data not yet available" Meldungen kontinuierlich
            function removeLoadingMessages() {
                const mapContainer = document.getElementById('map');
                if (mapContainer) {
                    const allDivs = mapContainer.getElementsByTagName('div');
                    const allSpans = mapContainer.getElementsByTagName('span');
                    const allTexts = [...allDivs, ...allSpans];
                    
                    for (let i = 0; i < allTexts.length; i++) {
                        const element = allTexts[i];
                        const text = element.textContent || element.innerText || '';
                        if (text.includes('Map data not yet available') || 
                            (text.includes('Loading') && !text.includes('Karte wird geladen'))) {
                            element.style.display = 'none';
                            element.style.visibility = 'hidden';
                            element.style.opacity = '0';
                            element.remove();
                        }
                    }
                }
            }

            // Sofort ausführen und dann regelmäßig überprüfen
            removeLoadingMessages();
            setTimeout(removeLoadingMessages, 100);
            setTimeout(removeLoadingMessages, 500);
            setTimeout(removeLoadingMessages, 1000);
            setTimeout(removeLoadingMessages, 2000);
            
            // Kontinuierliche Überwachung für die ersten 5 Sekunden
            const messageCleaner = setInterval(() => {
                removeLoadingMessages();
            }, 200);

            // Nach 5 Sekunden aufhören
            setTimeout(() => {
                clearInterval(messageCleaner);
            }, 5000);

            // Verschiedene Kartenlayer mit besseren URLs und Konfiguration
            // OpenStreetMap als Standard - am zuverlässigsten
            const mapLayers = {
                street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19,
                    minZoom: 1,
                    subdomains: ['a', 'b', 'c'],
                    tileSize: 256,
                    zoomOffset: 0,
                    crossOrigin: true,
                    errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='
                }),
                satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '© Esri, Maxar, GeoEye, Earthstar Geographics, CNES/Airbus DS, USDA, USGS, AeroGRID, IGN, and the GIS User Community',
                    maxZoom: 19,
                    minZoom: 1,
                    tileSize: 256,
                    zoomOffset: 0,
                    crossOrigin: true,
                    errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='
                }),
                terrain: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '© Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community',
                    maxZoom: 19,
                    minZoom: 1,
                    tileSize: 256,
                    zoomOffset: 0,
                    crossOrigin: true,
                    errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='
                }),
                street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19,
                    minZoom: 1,
                    subdomains: ['a', 'b', 'c'],
                    tileSize: 256,
                    zoomOffset: 0,
                    crossOrigin: true,
                    errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='
                }),
                hybrid: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '© Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community',
                    maxZoom: 19,
                    minZoom: 1,
                    tileSize: 256,
                    zoomOffset: 0,
                    crossOrigin: true,
                    errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='
                }),
                // Fallback-Layer für den Fall, dass alle anderen nicht funktionieren
                fallback: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 18,
                    minZoom: 1,
                    tileSize: 256,
                    zoomOffset: 0
                })
            };

            // Layer-Speicher
            currentLayers.base = mapLayers;

            // Event Listener für Kartenladung
            map.on('click', onMapClick);
            map.on('moveend', updateInfo);
            map.on('zoomend', updateInfo);

            // Sofort Layer hinzufügen - Satellitenbild als Standard
            try {
                mapLayers.satellite.addTo(map);
                console.log('Satellite Layer hinzugefügt');
            } catch (error) {
                console.log('Fallback zu alternativem Layer');
                if (mapLayers.fallback) {
                    mapLayers.fallback.addTo(map);
                } else {
                    mapLayers.street.addTo(map);
                }
            }

            // Karte bereit machen
            map.whenReady(function() {
                console.log('Karte ist bereit!');
                hideLoadingIndicator();
            });

            // Fallback: Loading-Indikator nach 3 Sekunden ausblenden
            setTimeout(() => {
                hideLoadingIndicator();
                console.log('Loading-Indikator entfernt (Timeout)');
            }, 3000);

            // Weltdaten laden
            loadWorldData();
            
            // Initiale Info aktualisieren
            updateInfo();
        }

        // Loading-Indikator Funktionen
        function showLoadingIndicator() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoadingIndicator() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        // Weltdaten laden
        function loadWorldData() {
            worldData.countries = [
                { name: 'Deutschland', lat: 51.1657, lng: 10.4515, capital: 'Berlin', population: '83.2M', funfact: 'Deutschland hat mehr als 25.000 Burgen und Schlösser!' },
                { name: 'Frankreich', lat: 46.2276, lng: 2.2137, capital: 'Paris', population: '67.4M', funfact: 'Frankreich ist das meistbesuchte Land der Welt mit über 80M Touristen/Jahr' },
                { name: 'Spanien', lat: 40.4637, lng: -3.7492, capital: 'Madrid', population: '47.3M', funfact: 'Spanien hat die zweitmeisten UNESCO-Welterbestätten weltweit' },
                { name: 'Italien', lat: 41.8719, lng: 12.5674, capital: 'Rom', population: '60.4M', funfact: 'Italien hat die meisten UNESCO-Welterbestätten weltweit (58 Stück)' },
                { name: 'Vereinigtes Königreich', lat: 55.3781, lng: -3.4360, capital: 'London', population: '67.9M', funfact: 'Das UK hat die drittmeisten Nobelpreisträger nach USA und Deutschland' },
                { name: 'USA', lat: 39.8283, lng: -98.5795, capital: 'Washington D.C.', population: '331.9M', funfact: 'Die USA hat 50 Bundesstaaten, aber nur 49 davon sind auf dem Festland' },

        // Ort suchen
        async function searchLocation() {
            const query = document.getElementById('searchLocation').value.trim();
            if (!query) return;

            const searchButton = document.querySelector('button[onclick="searchLocation()"]');
            const originalText = searchButton.textContent;
            searchButton.textContent = 'Suche...';
            searchButton.disabled = true;

            try {
                let found = false;
                
                const country = worldData.countries.find(c => 
                    c.name.toLowerCase().includes(query.toLowerCase()) ||
                    c.capital.toLowerCase().includes(query.toLowerCase())
                );
                
                if (country) {
                    map.setView([country.lat, country.lng], 6);
                    found = true;
                } else {
                    const city = worldData.cities.find(c => 
                        c.name.toLowerCase().includes(query.toLowerCase())
                    );
                    
                    if (city) {
                        map.setView([city.lat, city.lng], 10);
                        found = true;
                    }
                }

                if (!found) {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&addressdetails=1`);
                    const data = await response.json();
                    
                    if (data && data.length > 0) {
                        const result = data[0];
                        const lat = parseFloat(result.lat);
                        const lng = parseFloat(result.lon);
                        
                        let zoom = 10;
                        if (result.type === 'country') zoom = 5;
                        else if (result.type === 'state') zoom = 7;
                        else if (result.type === 'city' || result.type === 'town') zoom = 12;
                        else if (result.type === 'village') zoom = 14;
                        
                        map.setView([lat, lng], zoom);
                        
                        const marker = L.marker([lat, lng]).addTo(map);
                        marker.bindPopup(`
                            <div class="custom-popup">
                                <div class="popup-title">📍 ${result.display_name}</div>
                                <div class="popup-content">
                                    <strong>Typ:</strong> ${result.type}<br>
                                    <strong>Koordinaten:</strong> ${lat.toFixed(4)}°, ${lng.toFixed(4)}°<br>
                                    <strong>Gefunden über:</strong> OpenStreetMap
                                </div>
                            </div>
                        `).openPopup();
                        
                        found = true;
                    }
                }

                if (!found) {
                    alert('Ort nicht gefunden. Versuchen Sie einen anderen Suchbegriff.');
                }

            } catch (error) {
                console.error('Fehler bei der Suche:', error);
                alert('Fehler bei der Suche. Bitte versuchen Sie es erneut.');
            } finally {
                searchButton.textContent = originalText;
                searchButton.disabled = false;
            }
        }

        function movePlayer(direction) {
            if (!walkMode || !playerPosition) return;

            const now = Date.now();
            // Langsamere, flüssigere Bewegung
            if (now - lastStepTime < 100) return; // Maximal 10 Bewegungen pro Sekunde
            lastStepTime = now;

            // Kleinere, langsamere Schrittweite für flüssigere Bewegung
            // Bei Zoom-Level 19: 1 Grad ≈ 111 km, also 2m ≈ 0.000018 Grad
            const stepSize = 0.000018; // ~2 Meter pro Schritt für langsamere Bewegung
            
            let newLat = playerPosition[0];
            let newLng = playerPosition[1];

            switch (direction) {
                case 'up':
                    newLat += stepSize;
                    break;
                case 'down':
                    newLat -= stepSize;
                    break;
                case 'left':
                    newLng -= stepSize;
                    break;
                case 'right':
                    newLng += stepSize;
                    break;
            }

            playerPosition = [newLat, newLng];
            
            // Marker-Position aktualisieren
            if (playerMarker) {
                playerMarker.setLatLng(playerPosition);
                // Stelle sicher, dass Animation aktiv bleibt
                activateWalkingAnimation();
            }
            
            // Flüssige Kartenbewegung ohne Animation für direkte Steuerung
            map.panTo(playerPosition, { 
                animate: false
            });
            
            stepCount += 1; // 1 Schritt pro Bewegung
            totalDistance += 2; // 2 Meter pro Bewegung
            
            updateWalkStats();
        }

        // Funktion für kombinierte diagonale Bewegung
        function movePlayerCombined() {
            if (!walkMode || !playerPosition) return;

            const now = Date.now();
            // Langsamere, flüssigere Bewegung
            if (now - lastStepTime < 100) return; // Maximal 10 Bewegungen pro Sekunde
            lastStepTime = now;

            // Kleinere, langsamere Schrittweite für flüssigere Bewegung
            const stepSize = 0.000018; // ~2 Meter pro Schritt
            
            let newLat = playerPosition[0];
            let newLng = playerPosition[1];
            let moved = false;

            // Kombiniere alle gedrückten Richtungen für diagonale Bewegung
            if (pressedKeys['up']) {
                newLat += stepSize;
                moved = true;
            }
            if (pressedKeys['down']) {
                newLat -= stepSize;
                moved = true;
            }
            if (pressedKeys['left']) {
                newLng -= stepSize;
                moved = true;
            }
            if (pressedKeys['right']) {
                newLng += stepSize;
                moved = true;
            }

            if (!moved) return;

            playerPosition = [newLat, newLng];
            
            // Marker-Position aktualisieren
            if (playerMarker) {
                playerMarker.setLatLng(playerPosition);
                // Stelle sicher, dass Animation aktiv bleibt
                activateWalkingAnimation();
            }
            
            // Flüssige Kartenbewegung ohne Animation für direkte Steuerung
            map.panTo(playerPosition, { 
                animate: false
            });
            
            stepCount += 1; // 1 Schritt pro Bewegung
            // Für diagonale Bewegung: Entfernung ist √2 * Schrittweite ≈ 1.41 * 2m ≈ 2.8m
            const distance = Object.keys(pressedKeys).length > 1 ? 2.8 : 2;
            totalDistance += distance;
            
            updateWalkStats();
        }

        function handleKeyDown(e) {
            if (!walkMode) return;
            
            // Nur Pfeiltasten, keine WASD mehr
            let direction = null;
            
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                direction = 'up';
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                direction = 'down';
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                direction = 'left';
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                direction = 'right';
            }
            
            if (direction && !pressedKeys[direction]) {
                pressedKeys[direction] = true;
                // Sofortige Bewegung bei erstem Tastendruck
                movePlayerCombined();
                startContinuousMovement();
            }
        }

        function handleKeyUp(e) {
            if (!walkMode) return;
            
            // Nur Pfeiltasten, keine WASD mehr
            if (e.key === 'ArrowUp') {
                delete pressedKeys['up'];
            } else if (e.key === 'ArrowDown') {
                delete pressedKeys['down'];
            } else if (e.key === 'ArrowLeft') {
                delete pressedKeys['left'];
            } else if (e.key === 'ArrowRight') {
                delete pressedKeys['right'];
            }
            
            // Wenn keine Taste mehr gedrückt ist, stoppe kontinuierliche Bewegung
            if (Object.keys(pressedKeys).length === 0) {
                stopContinuousMovement();
            }
        }

        function startContinuousMovement() {
            if (movementAnimationFrame) return; // Bereits aktiv
            
            let lastFrameTime = Date.now();
            
            function animate() {
                if (!walkMode || Object.keys(pressedKeys).length === 0) {
                    stopContinuousMovement();
                    return;
                }
                
                const now = Date.now();
                // Begrenze auf maximal 10 FPS für langsamere Bewegung
                if (now - lastFrameTime >= 100) {
                    // Verwende kombinierte Bewegung für diagonale Richtungen
                    movePlayerCombined();
                    lastFrameTime = now;
                }
                
                // Nächster Frame für flüssige Animation
                movementAnimationFrame = requestAnimationFrame(animate);
            }
            
            movementAnimationFrame = requestAnimationFrame(animate);
        }

        function stopContinuousMovement() {
            if (movementAnimationFrame) {
                cancelAnimationFrame(movementAnimationFrame);
                movementAnimationFrame = null;
            }
        }

            document.getElementById('stepCount').textContent = stepCount;
            document.getElementById('walkDistance').textContent = Math.round(totalDistance) + ' m';

        // Funktion zur Berechnung der Entfernung zwischen zwei Koordinaten
        function getDistance(lat1, lng1, lat2, lng2) {
            const R = 6371; // Radius der Erde in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Funktion zum Abrufen von Ortsinformationen
        async function updateLocationInfo(lat, lng) {
            const locationInfoDiv = document.getElementById('locationInfo');
            const locationNameDiv = document.getElementById('locationName');
            const locationFactsDiv = document.getElementById('locationFacts');
            
            // Zuerst prüfen, ob wir nahe einer bekannten Stadt sind
            let nearestCity = null;
            let minDistance = Infinity;
            
            worldData.cities.forEach(city => {
                const distance = getDistance(lat, lng, city.lat, city.lng);
                if (distance < minDistance && distance < 50) { // Innerhalb von 50km
                    minDistance = distance;
                    nearestCity = city;
                }
            });
            
            // Falls keine Stadt gefunden, prüfe Länder
            let nearestCountry = null;
            if (!nearestCity) {
                worldData.countries.forEach(country => {
                    const distance = getDistance(lat, lng, country.lat, country.lng);
                    if (distance < minDistance && distance < 500) { // Innerhalb von 500km
                        minDistance = distance;
                        nearestCountry = country;
                    }
                });
            }
            
            if (nearestCity) {
                // Zeige Stadt-Informationen
                locationNameDiv.textContent = `🏙️ ${nearestCity.name}`;
                let factsHtml = `
                    <strong>Land:</strong> ${nearestCity.country}<br>
                    <strong>Einwohner:</strong> ${nearestCity.population}<br>
                    <strong>Entfernung:</strong> ${Math.round(minDistance)} km
                `;
                if (nearestCity.funfact) {
                    factsHtml += `<br><span style="font-style: italic; color: #667eea;">💡 ${nearestCity.funfact}</span>`;
                }
                locationFactsDiv.innerHTML = factsHtml;
                locationInfoDiv.style.display = 'block';
            } else if (nearestCountry) {
                // Zeige Länder-Informationen
                locationNameDiv.textContent = `🏛️ ${nearestCountry.name}`;
                let factsHtml = `
                    <strong>Hauptstadt:</strong> ${nearestCountry.capital}<br>
                    <strong>Einwohner:</strong> ${nearestCountry.population}<br>
                    <strong>Entfernung:</strong> ${Math.round(minDistance)} km
                `;
                if (nearestCountry.funfact) {
                    factsHtml += `<br><span style="font-style: italic; color: #667eea;">💡 ${nearestCountry.funfact}</span>`;
                }
                locationFactsDiv.innerHTML = factsHtml;
                locationInfoDiv.style.display = 'block';
            } else {
                // Verwende Reverse Geocoding API für unbekannte Orte
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10&addressdetails=1`);
                    const data = await response.json();
                    
                    if (data && data.address) {
                        const address = data.address;
                        let locationName = '';
                        let facts = [];
                        
                        // Baue Ortsname zusammen
                        if (address.city) {
                            locationName = `🏙️ ${address.city}`;
                            if (address.state) facts.push(`Region: ${address.state}`);
                            if (address.country) facts.push(`Land: ${address.country}`);
                        } else if (address.town) {
                            locationName = `🏘️ ${address.town}`;
                            if (address.state) facts.push(`Region: ${address.state}`);
                            if (address.country) facts.push(`Land: ${address.country}`);
                        } else if (address.village) {
                            locationName = `🏘️ ${address.village}`;
                            if (address.state) facts.push(`Region: ${address.state}`);
                            if (address.country) facts.push(`Land: ${address.country}`);
                        } else if (address.country) {
                            locationName = `🌍 ${address.country}`;
                            if (address.state) facts.push(`Region: ${address.state}`);
                        } else {
                            locationName = '🌍 Unbekannter Ort';
                        }
                        
                        locationNameDiv.textContent = locationName;
                        locationFactsDiv.innerHTML = facts.length > 0 ? facts.join('<br>') : 'Koordinatenbereich';
                        locationInfoDiv.style.display = 'block';
                    } else {
                        locationInfoDiv.style.display = 'none';
                    }
                } catch (error) {
                    console.error('Fehler beim Abrufen der Ortsinformationen:', error);
                    locationInfoDiv.style.display = 'none';
                }
            }
        }

        // Info Panel aktualisieren
        async function updateInfo() {
            const center = map.getCenter();
            const zoom = map.getZoom();
            
            document.getElementById('coordinates').innerHTML = `
                Breitengrad: ${center.lat.toFixed(4)}°<br>
                Längengrad: ${center.lng.toFixed(4)}°
            `;
            
            document.getElementById('zoomLevel').textContent = zoom;
            
            if (lastClickPosition) {
                const distance = map.distance(lastClickPosition, center);
                document.getElementById('distance').textContent = `${Math.round(distance / 1000)} km`;
            }
            
            // Ortsinformationen aktualisieren (mit Throttling: max. alle 2 Sekunden)
            const now = Date.now();
            if (now - lastLocationUpdate > 2000) {
                lastLocationUpdate = now;
                await updateLocationInfo(center.lat, center.lng);
            }
        }

        // Event Listener
        document.getElementById('countries').addEventListener('change', () => toggleLayer('countries'));
        document.getElementById('cities').addEventListener('change', () => toggleLayer('cities'));
        document.getElementById('mapStyle').addEventListener('change', changeMapStyle);

        document.getElementById('searchLocation').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchLocation();
            }
        });

        // Zoom-Event für Laufmodus (entfernt - automatisches Zoomen)
        function setupMapEvents() {
            // Keine Zoom-Beschränkung mehr nötig, da automatisch gezoomt wird
        }

        // Karte initialisieren wenn Seite geladen ist
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            setupMapEvents();
        });
    </script>
</body>
