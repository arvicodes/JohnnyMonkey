<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless World - Prozedurale Mittelalter-Welt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #2c2c2c;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .info-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            display: none;
        }

        .info-overlay.show {
            display: block;
        }

        .controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
        }

        .time-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
        }

        .time-display.night {
            background: rgba(20, 20, 60, 0.7);
        }

        .time-display.dawn {
            background: rgba(255, 150, 80, 0.7);
        }

        .time-display.dusk {
            background: rgba(150, 100, 80, 0.7);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="info" class="info-overlay">
        <div id="biomeInfo">Biom: Wiese</div>
        <div id="positionInfo">Position: (0, 0)</div>
        <div id="fpsInfo">FPS: 60</div>
        <div id="seedInfo">Seed: 12345</div>
    </div>
    <div id="controls" class="controls-overlay">
        <div>← → ↑ ↓ Bewegung | Shift: Sprint | E: Info | R: Neuer Seed</div>
    </div>
    <div id="timeDisplay" class="time-display">Tag</div>
    <script src="/endless-world/main.js"></script>
</body>
</html>
