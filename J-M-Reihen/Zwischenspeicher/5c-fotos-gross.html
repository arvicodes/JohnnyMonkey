<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #121212; color: #f2f2f2; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0; padding: 16px 18px 8px; }
  p.hint { margin: 0 18px 14px; color: #bbb; font-size: 0.9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
           gap: 12px; padding: 0 18px 40px; }
  .card { appearance: none; border: 0; padding: 0; margin: 0; background: #1e1e1e;
          border-radius: 10px; overflow: hidden; cursor: pointer; text-align: left;
          color: inherit; font: inherit; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .card:hover { transform: translateY(-2px); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #000; }
  .card span, .missing span { display: block; padding: 8px 10px 10px; font-size: 0.82rem; line-height: 1.25; }
  .missing { cursor: default; opacity: .7; }
  .placeholder { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
                  background: #2a2a2a; color: #888; font-size: 0.85rem; }
  #lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88);
        z-index: 20; align-items: center; justify-content: center; padding: 24px; }
  #lb.open { display: flex; }
  #lb img { max-width: min(92vw, 900px); max-height: 86vh; object-fit: contain;
             border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  #lb .cap { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center;
              font-size: 1.05rem; }
  #lb .x { position: absolute; top: 10px; right: 14px; width: 36px; height: 36px;
            border: 0; border-radius: 8px; background: rgba(255,255,255,.12); color: #fff;
            font-size: 22px; cursor: pointer; }
</style>
</head>

  <div id="lb" role="dialog" aria-modal="true">
    <button class="x" type="button" aria-label="Schließen">×</button>
    <img alt="">
    <div class="cap"></div>
  </div>
<script>
const lb = document.getElementById('lb');
const img = lb.querySelector('img');
const cap = lb.querySelector('.cap');
function openLb(src, name) {
  img.src = src; img.alt = name; cap.textContent = name;
  lb.classList.add('open');
}
function closeLb() { lb.classList.remove('open'); img.src = ''; }
document.querySelectorAll('.card[data-src]').forEach(btn => {
  btn.addEventListener('click', () => openLb(btn.dataset.src, btn.dataset.name));
});
lb.addEventListener('click', closeLb);
lb.querySelector('.x').addEventListener('click', e => { e.stopPropagation(); closeLb(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
</script>
