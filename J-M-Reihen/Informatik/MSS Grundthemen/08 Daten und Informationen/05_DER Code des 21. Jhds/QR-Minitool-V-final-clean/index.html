<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Generator</title>
<!-- QR Code library -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<!-- Alternative QR Code library als Fallback -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
// Fallback für bessere QR Code Unterstützung
if (typeof qrcode === 'undefined') {
  console.warn('qrcode-generator nicht geladen, versuche alternative Library');
  // Verwende alternative QR Code Library falls verfügbar
  if (typeof QRCode !== 'undefined') {
    console.log('Alternative QR Code Library gefunden');
  }
}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <h1>QR Generator</h1>
      <div class="seg-toggle" role="tablist" aria-label="Ansicht">
        <button id="tab-basic" role="tab" aria-selected="true">Grundversion</button>
        <button id="tab-rest" role="tab" aria-selected="false">Fortgeschritten</button>
      </div>
    </div>

    <div class="grid">
      <div>
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 6px;">
          <label class="label" title="Diese Zeichen werden im Byte Modus in UTF 8 codiert. Der Zähler nutzt die Anzahl der Bytes." style="margin-bottom: 0; flex: 1;">Zu codierender Text (Bereich 3)</label>
          <label class="switch small" style="margin: 0;">
            <input type="checkbox" id="showColorHighlight">
            <span style="color: #059669;">Buchstaben hervorheben (kleiner Hinweis)</span>
          </label>
        </div>
        <div contenteditable="true" id="text" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; resize: vertical; margin-bottom: 10px; min-height: 80px; white-space: pre-wrap; word-wrap: break-word; font-family: inherit; font-size: inherit; line-height: inherit; background: white;" role="textbox" aria-multiline="true"></div>


        <div class="binlist small" title="Daten-Darstellung je nach gewähltem Modus">
          <div class="title" id="data-title">ASCII Darstellung</div>
          <div id="bin-chips" class="chips"></div>
        </div>

        <div class="card" id="segpickers" style="margin-top: 20px;">
          <div class="segments-grid">
            <!-- Bereich 1: Mode -->
            <div class="segment-item">
              <div class="segment-header">
                <span class="color-dot" style="background:var(--c-mode)"></span>
                <span>Bereich 1</span>
              </div>
              <div class="segment-picker">
                <button data-seg="mode" data-val="off" class="active">Aus</button>
                <button data-seg="mode" data-val="sw">An</button>
                <button data-seg="mode" data-val="color">BUNT</button>
              </div>
            </div>

            <!-- Bereich 2: Count -->
            <div class="segment-item">
              <div class="segment-header">
                <span class="color-dot" style="background:var(--c-count)"></span>
                <span>Bereich 2</span>
              </div>
              <div class="segment-picker">
                <button data-seg="count" data-val="off" class="active">Aus</button>
                <button data-seg="count" data-val="sw">An</button>
                <button data-seg="count" data-val="color">BUNT</button>
              </div>
            </div>

            <!-- Bereich 4: Terminator -->
            <div class="segment-item">
              <div class="segment-header">
                <span class="color-dot" style="background:var(--c-term)"></span>
                <span>Bereich 4</span>
              </div>
              <div class="segment-picker">
                <button data-seg="term" data-val="off" class="active">Aus</button>
                <button data-seg="term" data-val="sw">An</button>
                <button data-seg="term" data-val="color">BUNT</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card" style="margin-top: 20px; margin-bottom: 16px;">
          <div class="small title">Codiermodus wechseln</div>
          <div class="picker">
            <button class="active" data-mode="byte" title="Byte-Modus: Alle Zeichen, ASCII-Codierung (Beispiel: Hallo)">Byte (ASCII)</button>
            <button data-mode="numeric" title="Numeric-Modus: Nur Zahlen (Beispiel: 123)">Numerisch</button>
            <button data-mode="alphanumeric" title="Alphanumeric-Modus: Buchstaben + Zahlen (Beispiel: Z5)">Alphanumerisch</button>
          </div>
        </div>

        <div id="rest-controls" style="display:none; margin-top: 20px;">
          <div class="card">
            <div class="small title">Version</div>
            <div style="position: relative; z-index: 1000;">
              <select id="version" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; background: white; cursor: pointer; z-index: 1001; position: relative; outline: none;">
              </select>
            </div>
          </div>

          <div class="card">
            <div class="checkboxes-grid">
              <!-- Padbytes anzeigen -->
              <div class="checkbox-item">
                <div class="checkbox-header">
                  <span class="color-dot" style="background:var(--c-pad)"></span>
                  <span>Padbytes</span>
                </div>
                <label class="checkbox-switch">
                  <input type="checkbox" id="showPad">
                  <span>anzeigen</span>
                </label>
              </div>

              <!-- Formatinfo Achsenkreuz markieren -->
              <div class="checkbox-item">
                <div class="checkbox-header">
                  <span class="color-dot" style="background:var(--c-format)"></span>
                  <span>Formatinfo</span>
                </div>
                <label class="checkbox-switch">
                  <input type="checkbox" id="highlightFormat">
                  <span>Achsenkreuz markieren</span>
                </label>
              </div>

              <!-- Fehlerkorrektur anzeigen -->
              <div class="checkbox-item">
                <div class="checkbox-header">
                  <span class="color-dot" style="background:var(--c-ecc)"></span>
                  <span>Fehlerkorrektur</span>
                </div>
                <label class="checkbox-switch">
                  <input type="checkbox" id="showECC">
                  <span>anzeigen</span>
                </label>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="small title">Fehlerkorrektur</div>
            <div class="row">
              <button class="btn secondary small" data-ecc="L" title="ca. 7 Prozent">L</button>
              <button class="btn secondary small" data-ecc="M" title="ca. 15 Prozent">M</button>
              <button class="btn secondary small" data-ecc="Q" title="ca. 25 Prozent">Q</button>
              <button class="btn secondary small" data-ecc="H" title="ca. 30 Prozent">H</button>
              <button class="btn secondary small chosen" data-ecc="none" title="nur Lehrmodus">none</button>
            </div>
          </div>

          <div class="card">
            <div class="small title">Maske</div>
            <div class="row">
              <button class="btn secondary mask-btn chosen" data-mask="none" title="ohne feste Maske">none</button>
              <button class="btn secondary mask-btn" data-mask="0" title="Maske 0"></button>
              <button class="btn secondary mask-btn" data-mask="1" title="Maske 1"></button>
              <button class="btn secondary mask-btn" data-mask="2" title="Maske 2"></button>
              <button class="btn secondary mask-btn" data-mask="3" title="Maske 3"></button>
              <button class="btn secondary mask-btn" data-mask="4" title="Maske 4"></button>
              <button class="btn secondary mask-btn" data-mask="5" title="Maske 5"></button>
              <button class="btn secondary mask-btn" data-mask="6" title="Maske 6"></button>
              <button class="btn secondary mask-btn" data-mask="7" title="Maske 7"></button>
              <button class="btn secondary mask-btn" data-mask="auto" title="automatisch">auto</button>
            </div>
            <label class="switch tiny" title="Schaltet das XOR der Maske auf die Datenbits. Aus bedeutet rohe Bits anzeigen.">
              <input type="checkbox" id="applyMask">
              <span>Maske anwenden</span>
            </label>
          </div>

          <label class="switch small muted box">
            <input type="checkbox" id="showFinal">
            <span>Scannbaren QR Code anzeigen</span>
          </label>

          <div class="row" style="margin-top:8px">
            <button id="btnSave" class="btn">SVG speichern</button>
          </div>
        </div>

        <div id="error" class="error"></div>

        <label id="final-toggle-basic" class="switch small muted box" style="margin-top:20px">
          <input type="checkbox" id="showFinalBasic">
          <span>Scannbaren QR Code anzeigen</span>
        </label>
      </div>

      <div>
        <div class="card">
          <div class="title">Vorschau</div>
          <div class="preview-wrap" title="Finder und Timing in schwarz weiß. Datenbits erscheinen je nach Ansicht und Auswahl.">
            <div id="svgHost"></div>
          </div>
        </div>

        <div class="card" id="finalCard" style="display:none">
          <div class="title">Scannbarer Code</div>
          <div class="preview-wrap" title="Dies ist der komplette QR Code, wie ein Scanner ihn liest">
            <div id="finalHost"></div>
          </div>
        </div>

       <div class="card" id="sizesCard" style="display:none">
          <!--<div class="title">Größen und Kapazitäten</div>
          <ul class="list" id="sizesList"></ul>-->
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
