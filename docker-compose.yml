version: '3.8'

services:
  johnnymonkey:
    # Kein `image:`-Tag → Portainer versucht keinen Docker-Hub-Pull.
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: johnnymonkey-app
    # Wie in DEPLOY_PORTAINER_CHECKLIST: Host 80 → Container 3000
    ports:
      - "0.0.0.0:80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # DB-Volume nur auf data/ — prisma/schema.prisma bleibt aus dem Image
      - DATABASE_URL=file:/app/server/data/dev.db
      - LOCAL_MATERIALS_PATH=/app
      - JM_REIHEN_PATH=/app/J-M-Reihen
    volumes:
      - johnnymonkey_db:/app/server/data
      - ./material:/app/material:ro
      - johnnymonkey_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.portainer.io.name=JohnnyMonkey"
      - "com.portainer.io.description=Educational Learning Platform"
      - "com.portainer.io.category=Application"
      - "com.portainer.io.managed=true"
    networks:
      - johnnymonkey-network

networks:
  johnnymonkey-network:
    driver: bridge
    name: johnnymonkey-network

volumes:
  postgres_data:
    name: johnnymonkey_postgres_data
  johnnymonkey_db:
    name: johnnymonkey_database
    driver: local
  johnnymonkey_logs:
    name: johnnymonkey_logs
    driver: local
