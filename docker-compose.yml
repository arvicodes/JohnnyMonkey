version: '3.8'

services:
  johnnymonkey:
    # Temporär nur lokales Image — kein Build (Server hatte ENOSPC/OOM).
    # Später wieder build: + pull_policy: build, wenn genug RAM/Disk da ist.
    image: johnnymonkey-johnnymonkey:latest
    pull_policy: never
    container_name: johnnymonkey-app
    # Host-Netz: App bindet direkt auf Host-Port 80 (umgeht Docker-Port-Proxy).
    # webserver/nginx auf Port 80 muss gestoppt sein.
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=80
      # DB-Volume nur auf data/ — prisma/schema.prisma bleibt aus dem Image
      - DATABASE_URL=file:/app/server/data/dev.db
      - FORCE_DB_IMPORT=false
      - LOCAL_MATERIALS_PATH=/app
      - JM_REIHEN_PATH=/app/J-M-Reihen
    volumes:
      - johnnymonkey_db:/app/server/data
      - ./material:/app/material:ro
      - johnnymonkey_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.portainer.io.name=JohnnyMonkey"
      - "com.portainer.io.description=Educational Learning Platform"
      - "com.portainer.io.category=Application"
      - "com.portainer.io.managed=true"

  # Outbound-Tunnel: Zugriff ohne offenen Port 80 (VPN blockiert 80, nur 9443 ist frei).
  # URL steht in den Logs von johnnymonkey-tunnel (*.trycloudflare.com).
  tunnel:
    image: cloudflare/cloudflared:latest
    pull_policy: never
    container_name: johnnymonkey-tunnel
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:80
    depends_on:
      - johnnymonkey
    restart: unless-stopped
    labels:
      - "com.portainer.io.name=JohnnyMonkey Tunnel"
      - "com.portainer.io.category=Application"

volumes:
  postgres_data:
    name: johnnymonkey_postgres_data
  johnnymonkey_db:
    name: johnnymonkey_database
    driver: local
  johnnymonkey_logs:
    name: johnnymonkey_logs
    driver: local
