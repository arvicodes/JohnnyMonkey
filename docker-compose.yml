version: '3.8'

services:
  johnnymonkey:
    build: 
      context: .
      dockerfile: Dockerfile
    image: johnnymonkey:latest
    pull_policy: build
    container_name: johnnymonkey-app
    # Keine published ports mehr - nginx leitet weiter
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistente Datenbank
      - johnnymonkey_db:/app/server/prisma
      # Material-Dateien
      - ./material:/app/material:ro
      # Optional: Logs für einfacheren Zugriff
      - johnnymonkey_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Portainer Labels für bessere Organisation
      - "com.portainer.io.name=JohnnyMonkey"
      - "com.portainer.io.description=Educational Learning Platform"
      - "com.portainer.io.category=Application"
      - "com.portainer.io.managed=true"
    networks:
      - johnnymonkey-network

  nginx:
    image: nginx:alpine
    container_name: johnnymonkey-nginx
    ports:
      - "8080:80"  # Host Port 8080 → Container Port 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - johnnymonkey
    restart: unless-stopped
    networks:
      - johnnymonkey-network
    labels:
      - "com.portainer.io.name=JohnnyMonkey Nginx"
      - "com.portainer.io.description=Reverse Proxy for JohnnyMonkey"
      - "com.portainer.io.category=Application"
      - "com.portainer.io.managed=true"

  # Optional: Separate database service (for PostgreSQL)
  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: johnnymonkey
  #     POSTGRES_USER: johnnymonkey
  #     POSTGRES_PASSWORD: your_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

  # Portainer läuft bereits separat - nicht hier einbinden
  # Portainer kann über http://localhost:9000 erreicht werden

networks:
  johnnymonkey-network:
    driver: bridge
    name: johnnymonkey-network

volumes:
  postgres_data:
    name: johnnymonkey_postgres_data
  johnnymonkey_db:
    name: johnnymonkey_database
    driver: local
  johnnymonkey_logs:
    name: johnnymonkey_logs
    driver: local
