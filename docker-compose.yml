version: '3.8'

services:
  johnnymonkey:
    build: 
      context: .
      dockerfile: Dockerfile
    image: johnnymonkey:latest
    pull_policy: build
    container_name: johnnymonkey-app
    # Port 80 für direkten Zugriff im LAN
    ports:
      - "80:3000"  # Host Port 80 → Container Port 3000 (Node.js Server)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/server/prisma/dev.db
      - LOCAL_MATERIALS_PATH=/app
    volumes:
      # Verwende Prisma-Verzeichnis aus dem Git-Checkout (inkl. dev.db)
      - ./server/prisma:/app/server/prisma
      # Material-Dateien
      - ./material:/app/material:ro
      # Verwende J-M-Reihen direkt aus dem Git-Checkout
      - ./J-M-Reihen:/app/J-M-Reihen
      # Optional: Logs für einfacheren Zugriff
      - johnnymonkey_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Portainer Labels für bessere Organisation
      - "com.portainer.io.name=JohnnyMonkey"
      - "com.portainer.io.description=Educational Learning Platform"
      - "com.portainer.io.category=Application"
      - "com.portainer.io.managed=true"
    networks:
      - johnnymonkey-network

  # Nginx nicht mehr benötigt - Sophos Firewall übernimmt HTTPS-Terminierung
  # Node.js Server läuft direkt auf Port 80

  # Optional: Separate database service (for PostgreSQL)
  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: johnnymonkey
  #     POSTGRES_USER: johnnymonkey
  #     POSTGRES_PASSWORD: your_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

  # Portainer läuft bereits separat - nicht hier einbinden
  # Portainer kann über http://localhost:9000 erreicht werden

networks:
  johnnymonkey-network:
    driver: bridge
    name: johnnymonkey-network

volumes:
  postgres_data:
    name: johnnymonkey_postgres_data
  johnnymonkey_logs:
    name: johnnymonkey_logs
    driver: local
