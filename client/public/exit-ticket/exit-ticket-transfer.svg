      <stop offset="1" stop-color="#3440B6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="40" fill="url(#bg)"/>

  <!-- Book icon (simple) -->
  <g opacity="0.9">
    <rect x="740" y="70" width="120" height="90" rx="14" fill="#FFF3B8"/>
    <path d="M740 95c25-12 50-12 80 0s55 12 40 0v65c-15 10-35 12-55 7-30-8-55-8-65-1V95z" fill="#FFB86B" opacity="0.8"/>
