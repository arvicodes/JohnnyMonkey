    <path d="M0 380c130-50 210-50 320 0s190 50 320 0 190-50 320 0v160H0V380z" fill="#4F2D6A" opacity="0.22"/>
    <path d="M120 360c90-25 160-25 250 0s160 25 250 0 160-25 250 0v90H120v-90z" fill="#7A4A2D" opacity="0.26"/>

    <path d="M210 370c0-30 20-55 50-55h160c30 0 50 25 50 55v90H210v-90z" fill="url(#bridge)" opacity="0.92"/>
    <path d="M510 370c0-30 20-55 50-55h160c30 0 50 25 50 55v90H510v-90z" fill="url(#bridge)" opacity="0.92"/>

    <!-- Main arches -->
    <path d="M300 400c30-130 120-210 180-210s150 80 180 210" stroke="#2B3A9B" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
    <path d="M310 400c28-112 108-184 170-184s142 72 170 184" stroke="#8EA0FF" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

    <!-- Arrow flow -->
