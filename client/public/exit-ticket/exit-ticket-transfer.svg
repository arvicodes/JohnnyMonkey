<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="0" x2="900" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A"/>
      <stop offset="0.52" stop-color="#C8F28A"/>
      <stop offset="1" stop-color="#6CE7A8"/>
    </linearGradient>
    <linearGradient id="bridge" x1="320" y1="180" x2="640" y2="430" gradientUnits="userSpaceOnUse">
