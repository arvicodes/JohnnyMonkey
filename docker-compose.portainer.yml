version: '3.8'

services:
  johnnymonkey:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: johnnymonkey-app
    # Port 80 für direkten Zugriff im LAN
    ports:
      - "80:3000"  # Host Port 80 → Container Port 3000 (Node.js Server)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      # Persistente Datenbank (wird beim Start aus backup_latest.db synchronisiert)
      - johnnymonkey_db:/app/server/prisma
      # Material-Dateien - für Portainer: absoluter Pfad oder Volume
      - johnnymonkey_material:/app/material:ro
      # J-M-Reihen direkt aus dem aktuellen Git-Checkout des Stacks
      - ./J-M-Reihen:/app/J-M-Reihen
      # Optional: Logs für einfacheren Zugriff
      - johnnymonkey_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Portainer Labels für bessere Organisation
      - "com.portainer.io.name=JohnnyMonkey"
      - "com.portainer.io.description=Educational Learning Platform"
      - "com.portainer.io.category=Application"
      - "com.portainer.io.managed=true"
    networks:
      - johnnymonkey-network

networks:
  johnnymonkey-network:
    driver: bridge
    name: johnnymonkey-network

volumes:
  postgres_data:
    name: johnnymonkey_postgres_data
  portainer_data:
    name: johnnymonkey_portainer_data
  johnnymonkey_db:
    name: johnnymonkey_database
    driver: local
  johnnymonkey_logs:
    name: johnnymonkey_logs
    driver: local
  johnnymonkey_material:
    name: johnnymonkey_material
    driver: local

