version: '3.8'

services:
  johnnymonkey:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: johnnymonkey-app
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=80
      - DATABASE_URL=file:/app/server/data/dev.db
      - LOCAL_MATERIALS_PATH=/app
      - JM_REIHEN_PATH=/app/J-M-Reihen
    volumes:
      - johnnymonkey_db:/app/server/data
      - ./material:/app/material:ro
      - johnnymonkey_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.portainer.io.name=JohnnyMonkey"
      - "com.portainer.io.description=Educational Learning Platform"
      - "com.portainer.io.category=Application"
      - "com.portainer.io.managed=true"

  tunnel:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    container_name: johnnymonkey-tunnel
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:80
    restart: unless-stopped

volumes:
  postgres_data:
    name: johnnymonkey_postgres_data
  johnnymonkey_db:
    name: johnnymonkey_database
    driver: local
  johnnymonkey_logs:
    name: johnnymonkey_logs
    driver: local
