services:
  - type: web
    name: johnnymonkey
    env: node
    plan: free
    buildCommand: |
      npm install
      cd server && npm install
      cd ../client && npm install
      cd ../server && npm run build
      cd ../client && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./prisma/render.db
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    disk:
      name: johnnymonkey-data
      mountPath: /opt/render/project/src/server/prisma
      sizeGB: 1
