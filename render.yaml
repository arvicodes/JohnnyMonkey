services:
  - type: web
    name: johnnymonkey
    env: node
    plan: free
    buildCommand: |
      echo "🚀 Starting build process..."
      npm install
      echo "📦 Building server..."
      cd server && npm install && npm run build
      echo "📦 Building client..."
      cd ../client && npm install && npm run build
      echo "📁 Copying client build to server..."
      cd ../server && rm -rf client-build && cp -r ../client/build ./client-build
      echo "🔍 Verifying client-build contents..."
      ls -la client-build/
      echo "📁 Verifying server structure..."
      ls -la
      echo "✅ Build completed successfully!"
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://johnnymonkey_user:D7ZB4mXFR77t1fShEWC0UKhhy60rsHCN@dpg-d2qau7be5dus73brrtbg-a.frankfurt-postgres.render.com/johnnymonkey
      - key: REACT_APP_API_URL
        value: https://johnnymonkey.onrender.com
    healthCheckPath: /health
    autoDeploy: true
    branch: main
