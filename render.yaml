services:
  - type: web
    name: johnnymonkey
    env: node
    plan: free
    buildCommand: |
      echo "🚀 Starting build process..."
      npm install
      echo "📦 Building server..."
      cd server && npm install && npm run build
      echo "📦 Building client..."
      cd ../client && npm install && npm run build
      echo "📁 Copying client build to server..."
      cd ../server && rm -rf client-build && cp -r ../client/build ./client-build
      echo "🔍 Verifying client-build contents..."
      ls -la client-build/
      echo "✅ Build completed successfully!"
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./prisma/render.db
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    disk:
      name: johnnymonkey-data
      mountPath: /opt/render/project/src/server/prisma
      sizeGB: 1
